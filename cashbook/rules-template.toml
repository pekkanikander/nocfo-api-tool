[matching]
days_before = 1
days_after  = 3
max_subset  = 8
tolerance   = 0.50
# M8 cost weights: lower total cost wins
weight_unmatched     = 100
weight_near_miss     = 10
weight_date_distance = 1
weight_subset_size   = 0.1
weight_coherence     = -5

[classification]
majority_min    = 3      # K4
same_amount_min = 3      # K5

# A rule hits when every predicate it carries holds: keywords (case-insensitive substrings), no_text,
# from/to dates, max_amount and min_per_day; flag = true sends its lines to review (K1).
# The first rule that hits wins, so order by priority.
# Below is one stub per revenue and expense account; uncomment the ones to use and fill in their keywords.

