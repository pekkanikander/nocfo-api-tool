# Shared rules for the cash-book fixtures. Fixture-only: every account number and name here
# is a placeholder, and the expected outputs depend on these exact values.

[accounts]
cash           = { number = "1900", name = "Kassa" }
mobilepay      = { number = "1930", name = "MobilePay" }
fees           = { number = "8100", name = "Palvelumaksut" }
reimbursements = { number = "2900", name = "Kulukorvausvelat" }

[mobilepay]
# Maksutapa values, by meaning (I6). Expense and payout values are still unknown.
payment_in = ["Maksa Lippaaseen"]
fee        = ["Palvelumaksu"]
expense    = []
payout     = []

[matching]
days_before = 1
days_after  = 3
max_subset  = 8
tolerance   = 0.50
# M8 cost weights: lower total cost wins
weight_unmatched     = 100
weight_near_miss     = 10
weight_date_distance = 1
weight_subset_size   = 0.1
weight_coherence     = -5

[classification]
majority_min    = 3      # K4
same_amount_min = 3      # K5

[classification.cafe]                # K6
account                  = "3000"
max_amount               = 10.00
min_transactions_per_day = 3

# Keywords are case-insensitive substrings. The first rule that hits wins, so order by priority.

[[classification.income]]
account  = "3000"
name     = "Kahvila"
keywords = ["kahvila", "kahvi", "kaffe", "tee", "muffi", "piirak", "mehu"]

